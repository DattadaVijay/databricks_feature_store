resources:
  jobs:
    iris_pipeline:
      name: iris-feature-store

      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: schema
          default: ${var.schema}

      environments:
        - environment_key: feature_env
          spec:
            environment_version: "4"
            dependencies:
              - databricks-feature-engineering
              - scikit-learn
              - mlflow

      tasks:
        - task_key: build_features
          environment_key: feature_env
          notebook_task:
            notebook_path: ../src/feature_store/01_features.py