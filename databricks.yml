# This is a Declarative Automation Bundle definition for feature_store.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: feature_store
  uuid: 073a7104-0f62-437d-bb99-14375f11b2c6

include:
  - resources/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-e3761da8-7d95.cloud.databricks.com
    variables:
      catalog: main
      schema: default
  prod:
    mode: production
    workspace:
      host: https://dbc-e3761da8-7d95.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/dattada.vijay@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/dattada.vijay@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: main
      schema: prod
    permissions:
      - user_name: dattada.vijay@gmail.com
        level: CAN_MANAGE
